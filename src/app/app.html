<p-confirmdialog />
@if (!svc.unlocked()) {
  <app-lock />
} @else if (!svc.me() || managing()) {
  <app-members [canClose]="true" (closed)="managing.set(false)" />
} @else {
  <div class="min-h-dvh">
    <!-- 手機頁首：品牌 + 成員頭像（點頭像切換身分） -->
    <header class="sticky top-0 z-30 bg-navy px-5 pb-3 pt-[calc(env(safe-area-inset-top)+12px)] md:hidden">
      <div class="flex h-11 items-center justify-between">
        <div class="flex items-center gap-[9px]">
          <span class="text-sand"><app-icon name="plane" [size]="19" /></span>
          <div class="flex flex-col gap-px">
            <h1 class="text-[18px] font-bold leading-snug text-on-dark">香港行</h1>
            <span class="text-[12.5px] font-medium leading-tight text-on-dark-muted">11/24–11/27</span>
          </div>
        </div>
        <button type="button" class="flex items-center" (click)="managing.set(true)" aria-label="切換身分或建立身分">
          @for (m of svc.members(); track m; let i = $index) {
            <span [class.-ml-2]="i > 0"><app-avatar [name]="m" [size]="30" ring="#202C39" /></span>
          }
        </button>
      </div>
    </header>

    <!-- 桌機頁首 -->
    <div class="sticky top-0 z-30 hidden md:block">
    <header class="flex h-16 items-center justify-between bg-navy px-8">
      <div class="flex items-center gap-2.5">
        <span class="text-sand"><app-icon name="plane" [size]="20" /></span>
        <h1 class="text-[17px] font-semibold text-on-dark">香港行 11/24–11/27</h1>
      </div>
      <div class="flex items-center gap-3 text-[14px] text-on-dark-muted">
        <button type="button" class="flex items-center gap-2" (click)="managing.set(true)" aria-label="切換身分或建立身分">
          <app-avatar [name]="svc.me()!" [size]="26" /> {{ svc.me() }}
        </button>
        <button type="button" (click)="svc.lock()" aria-label="登出"><app-icon name="logout" [size]="19" /></button>
      </div>
    </header>
    <nav class="flex h-[52px] items-stretch gap-1 border-b border-border bg-white px-6" role="tablist">
      @for (t of tabs; track t.id) {
        <button type="button" role="tab" [attr.aria-selected]="tab() === t.id"
          class="-mb-px flex items-center gap-[7px] border-b-2 px-2.5 text-[14px]"
          [class]="tab() === t.id ? 'border-orange font-bold text-orange' : 'border-transparent font-medium text-muted'"
          (click)="tab.set(t.id)">
          <app-icon [name]="t.icon" [size]="17" /> {{ t.label }}
        </button>
      }
    </nav>
    </div>

    <main class="pb-36 md:pb-10">
      @switch (tab()) {
        @case ('trip') { <app-itinerary /> }
        @case ('money') { <div class="mx-auto max-w-7xl p-5 md:p-8"><app-expenses /></div> }
        @case ('notes') { <div class="mx-auto max-w-7xl p-5 md:p-8"><app-notes /></div> }
        @case ('packing') { <div class="mx-auto max-w-7xl p-5 md:p-8"><app-packing /></div> }
      }
    </main>

    <!-- 手機底部導覽 -->
    <nav class="fixed inset-x-0 bottom-0 z-20 flex justify-between border-t border-border bg-white px-3 pb-[calc(env(safe-area-inset-bottom)+8px)] pt-2.5 md:hidden" role="tablist">
      @for (t of tabs; track t.id) {
        <button type="button" role="tab" [attr.aria-selected]="tab() === t.id"
          class="flex flex-1 flex-col items-center justify-center gap-1 py-1.5 text-[11px]"
          [class]="tab() === t.id ? 'font-bold text-orange' : 'font-medium text-faint'"
          (click)="tab.set(t.id)">
          <app-icon [name]="t.icon" [size]="22" /> {{ t.label }}
        </button>
      }
    </nav>
  </div>
}
